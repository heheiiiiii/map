<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <!-- 오리지널 플레이스홀더: 섬 안내소 수달 '보리' (입·눈 없음) -->
  <defs>
    <radialGradient id="fur" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#a7714b"/><stop offset="1" stop-color="#7c4d31"/></radialGradient>
    <linearGradient id="knit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f8f86"/><stop offset="1" stop-color="#2d6c66"/></linearGradient>
  </defs>
  <!-- 몸 -->
  <path d="M150 1000 C150 800 230 690 400 690 C570 690 650 800 650 1000 Z" fill="url(#knit)"/>
  <path d="M330 700 L400 790 L470 700" fill="none" stroke="#f3e6cf" stroke-width="18" stroke-linejoin="round"/>
  <g stroke="#2a605a" stroke-width="6" opacity=".45" fill="none">
    <path d="M220 860 q20 14 40 0 q20 14 40 0"/><path d="M500 860 q20 14 40 0 q20 14 40 0"/>
    <path d="M220 930 q20 14 40 0 q20 14 40 0"/><path d="M500 930 q20 14 40 0 q20 14 40 0"/>
  </g>
  <!-- 이름표 -->
  <rect x="455" y="800" width="120" height="58" rx="12" fill="#fff8e7" stroke="#d9b779" stroke-width="5"/>
  <text x="515" y="840" font-family="sans-serif" font-size="30" font-weight="700" fill="#6b4a2b" text-anchor="middle">보리</text>
  <!-- 목 -->
  <ellipse cx="400" cy="680" rx="110" ry="50" fill="#7c4d31"/>
  <!-- 귀 -->
  <circle cx="215" cy="300" r="52" fill="#7c4d31"/><circle cx="215" cy="300" r="26" fill="#5c3722"/>
  <circle cx="585" cy="300" r="52" fill="#7c4d31"/><circle cx="585" cy="300" r="26" fill="#5c3722"/>
  <!-- 머리 -->
  <ellipse cx="400" cy="440" rx="215" ry="235" fill="url(#fur)"/>
  <!-- 이마 무늬 -->
  <path d="M370 230 q30 -20 60 0 q-10 30 -30 34 q-20 -4 -30 -34z" fill="#6a4029" opacity=".5"/>
  <!-- 주둥이 -->
  <ellipse cx="400" cy="540" rx="135" ry="100" fill="#f1dcbc"/>
  <!-- 볼 -->
  <ellipse cx="270" cy="500" rx="34" ry="22" fill="#e98f7d" opacity=".55"/>
  <ellipse cx="530" cy="500" rx="34" ry="22" fill="#e98f7d" opacity=".55"/>
  <!-- 코 -->
  <ellipse cx="400" cy="490" rx="40" ry="26" fill="#3b2418"/>
  <ellipse cx="388" cy="482" rx="12" ry="6" fill="#fff" opacity=".5"/>
  <!-- 수염 -->
  <g stroke="#5c3722" stroke-width="5" stroke-linecap="round">
    <path d="M300 540 L215 525"/><path d="M300 560 L210 568"/>
    <path d="M500 540 L585 525"/><path d="M500 560 L590 568"/>
  </g>
  <!-- 머리 위 작은 해초 핀 -->
  <path d="M520 235 q30 -50 10 -90 q40 30 20 95z" fill="#6fbf73"/>
</svg>
